name: Publish site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v4

      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          repository: monknomo/straight-laced
          path: ../straight-laced

      - name: Checkout published-webpage branch
        uses: actions/checkout@v4
        with:
          ref: published-webpage
          path: published-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            blinker==1.5 \
            bottle==0.12.23 \
            commonmark==0.9.1 \
            docutils==0.19 \
            feedgenerator==2.0.0 \
            importlib-metadata==5.0.0 \
            "Jinja2==3.1.2" \
            libgravatar==1.0.0 \
            Markdown==3.4.1 \
            "MarkupSafe==2.1.1" \
            pelican==4.8.0 \
            "pelican-avatar==1.0.3" \
            pelican-sitemap==1.0.2 \
            pelican-webassets==2.0.0 \
            Pygments==2.13.0 \
            python-dateutil==2.8.2 \
            "pytz==2022.6" \
            rich==12.6.0 \
            six==1.16.0 \
            Unidecode==1.3.6 \
            webassets==2.0 \
            zipp==3.10.0

      - name: Build site
        run: pelican content -s publishconf.py

      - name: Sync built docs to published-webpage branch
        run: rsync -a --delete docs/ published-branch/docs/

      - name: Commit and push to published-webpage
        working-directory: published-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Publish site from main@${{ github.sha }}"
          git push origin published-webpage
